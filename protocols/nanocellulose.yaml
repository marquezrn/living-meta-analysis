name: Nanocellulose-stabilized Pickering emulsions
version: '1.0'
topic: Pickering emulsions stabilized by nanocellulose
inclusion:
  - Original experiments on oil/water Pickering emulsions containing nanocellulose
  - Film and coating studies only when identifiable emulsion experiments are reported
exclusion:
  - Reviews are discovery sources only
  - Pure simulations are not primary experimental evidence
analysis_mode: descriptive
outcome: Droplet_Size_um
effect_measure: MD
enabled_sources: [pubmed, europepmc, crossref]
queries:
  openalex: 'Pickering nanocellulose'
  crossref: 'Pickering nanocellulose'
  pubmed: '(Pickering[Title/Abstract]) AND (nanocellulose[Title/Abstract] OR "cellulose nanocrystals"[Title/Abstract] OR "cellulose nanofibrils"[Title/Abstract])'
  europepmc: 'Pickering AND (nanocellulose OR "cellulose nanocrystals" OR "cellulose nanofibrils")'
  scopus: 'TITLE-ABS-KEY(Pickering AND (nanocellulose OR "cellulose nanocrystals" OR "cellulose nanofibrils"))'
  arxiv: 'all:Pickering AND (all:nanocellulose OR all:"cellulose nanocrystals")'
variables:
  - Emulsion_Type
  - Oil_Type
  - Oil_Content_vol_percent
  - Emulsification_Method
  - Droplet_Size_um
  - Stability_Days
  - Electrolyte_Concentration_mM
  - Type_of_Nanocellulose
  - Modification
  - Concentration_wt_percent
  - Particle_L_nm
  - Particle_w_nm
  - Aspect_Ratio
  - Crystallinity_Index
  - Zeta_Potential_mV
  - Surface_Charge_Density_e_nm2
  - Surface_Energy_mJ_m2
  - Contact_Angle_deg
  - Oil_Content_wt_percent
  - Surface_Charge_Density_mmol_g
  - pH
  - Temperature
  - Storage_Time
  - Rheology
  - Preparation_Settings
  - Replicates
  - Uncertainty
